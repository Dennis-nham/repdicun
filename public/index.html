<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>📂 Trợ Lý Tìm File</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#e9ebee;min-height:100vh}

/* ── Launcher FAB ── */
#fab{
  position:fixed;bottom:22px;right:22px;width:52px;height:52px;
  border-radius:50%;background:linear-gradient(135deg,#1877f2,#0d47a1);
  border:none;cursor:pointer;box-shadow:0 3px 14px rgba(21,101,192,.55);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;z-index:9999;transition:transform .18s,box-shadow .18s;
  color:#fff;
}
#fab:hover{transform:scale(1.08);box-shadow:0 5px 20px rgba(21,101,192,.65)}
#fab .badge{
  position:absolute;top:-3px;right:-3px;background:#e53935;
  color:#fff;border-radius:10px;font-size:9px;font-weight:700;
  padding:1px 4px;min-width:16px;text-align:center;
  border:2px solid #fff;display:none;
}
#fab .badge.show{display:block}

/* ── Chat Window ── */
.cw{
  position:fixed;bottom:84px;right:20px;
  width:400px;height:600px;
  background:#fff;border-radius:18px;
  box-shadow:0 12px 48px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
  display:flex;flex-direction:column;overflow:hidden;
  z-index:9998;
  transition:opacity .2s,transform .2s;
  transform-origin:bottom right;
}
.cw.off{opacity:0;pointer-events:none;transform:scale(.9) translateY(14px)}
.cw.on {opacity:1;transform:scale(1) translateY(0)}

/* ── Header — compact single row ── */
.ch{
  background:linear-gradient(135deg,#1877f2,#0d47a1);
  padding:9px 12px;display:flex;align-items:center;gap:8px;
  flex-shrink:0;min-height:48px;
}
.ch-av{
  width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
}
.ch-info{flex:1;min-width:0}
.ch-info h3{color:#fff;font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-info p {color:rgba(255,255,255,.72);font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{
  width:6px;height:6px;border-radius:50%;background:#4caf50;
  display:inline-block;margin-right:3px;animation:pulse 2s infinite;
}
.sdot.busy{background:#ff9800}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.ch-actions{display:flex;gap:3px;flex-shrink:0}
.ch-btn{
  background:transparent;border:none;color:rgba(255,255,255,.85);
  width:28px;height:28px;border-radius:8px;cursor:pointer;
  font-size:13px;transition:background .13s;display:flex;align-items:center;justify-content:center;
}
.ch-btn:hover{background:rgba(255,255,255,.2)}

/* ── Filter bar — scrollable chips ── */
.fbar{
  padding:6px 10px;border-bottom:1px solid #f0f2f5;
  display:flex;gap:5px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;
}
.fbar::-webkit-scrollbar{display:none}
.ftag{
  padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;border:1.5px solid transparent;
  background:#f0f2f5;color:#57606a;transition:all .1s;
}
.ftag.active{background:#e8f0fe;color:#1565c0;border-color:#1565c0}
.ftag:hover{background:#e8f0fe;color:#1565c0}

/* ── Messages ── */
.msgs{
  flex:1;overflow-y:auto;padding:12px;
  display:flex;flex-direction:column;gap:8px;
}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:4px}

/* ── Bubbles ── */
.mrow{display:flex;gap:7px;align-items:flex-end}
.mrow.user{flex-direction:row-reverse}
.mav{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;
}
.mrow.bot .mav{background:#e8f0fe}
.mrow.user .mav{background:#1565c0}

.bub{
  max-width:86%;padding:8px 12px;border-radius:16px;
  font-size:13px;line-height:1.5;word-break:break-word;
}
.mrow.bot  .bub{background:#f0f2f5;color:#1f2328;border-bottom-left-radius:3px}
.mrow.user .bub{background:#1565c0;color:#fff;border-bottom-right-radius:3px}

.mt{font-size:9.5px;color:#b0bec5;margin-top:2px;padding:0 2px}
.mrow.user .mt{text-align:right}

/* ── Typing ── */
.dots{display:flex;gap:4px;padding:5px 2px}
.dots span{
  width:7px;height:7px;border-radius:50%;background:#9aa0a6;
  animation:bop .8s infinite;
}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── Scan bar ── */
.scanbar{
  background:#e3f2fd;border-radius:8px;padding:9px 12px;
  font-size:12px;color:#1565c0;display:flex;align-items:center;gap:8px;
}
.spin{animation:spin 1s linear infinite;display:inline-block;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.pgbar{background:#bbdefb;border-radius:4px;height:3px;flex:1;overflow:hidden}
.pgfill{background:#1565c0;height:100%;width:0%;animation:pggo 1.8s ease-in-out forwards}
@keyframes pggo{to{width:100%}}

/* ── Result list ── */
.rlist{display:flex;flex-direction:column;gap:5px}
.rhead{font-size:11px;color:#5f6368;font-weight:600;padding:2px 0 6px}

/* ── File card ── */
.fcard{
  background:#fff;border:1.5px solid #e8eaed;border-radius:10px;
  padding:9px 11px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;
  transition:border-color .15s,box-shadow .15s,background .1s;
}
.fcard:hover{border-color:#1565c0;box-shadow:0 2px 8px rgba(21,101,192,.13);background:#f8fbff}
.fcard.sel{border-color:#1565c0;background:#e8f0fe}
.fcard.sel .fname{color:#1565c0}

.fic{font-size:22px;flex-shrink:0;margin-top:1px;line-height:1}
.fi{flex:1;min-width:0}
.fname{font-size:12.5px;font-weight:700;color:#1f2328;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdir{font-size:10.5px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fmeta{font-size:10px;color:#9aa0a6;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.sbadge{
  font-size:9.5px;padding:2px 6px;border-radius:12px;
  background:#e8f0fe;color:#1565c0;font-weight:700;
  flex-shrink:0;align-self:center;margin-left:auto;
}

/* ── Action bar ── */
.abar{display:flex;flex-wrap:wrap;gap:5px;padding:7px 0 3px}
.abtn{
  padding:5px 11px;border-radius:20px;border:1.5px solid;
  font-size:11px;font-weight:700;cursor:pointer;
  transition:background .13s,color .13s,transform .1s;
  display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.abtn:hover{transform:translateY(-1px)}
.abtn:active{transform:translateY(0)}
.abtn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.ab-read   {background:#fff;border-color:#1565c0;color:#1565c0}
.ab-read:hover{background:#1565c0;color:#fff}
.ab-open   {background:#fff;border-color:#0277bd;color:#0277bd}
.ab-open:hover{background:#0277bd;color:#fff}
.ab-edit   {background:#fff;border-color:#ef6c00;color:#ef6c00}
.ab-edit:hover{background:#ef6c00;color:#fff}
.ab-cv     {background:#fff;border-color:#7b1fa2;color:#7b1fa2}
.ab-cv:hover{background:#7b1fa2;color:#fff}
.ab-copy   {background:#fff;border-color:#2e7d32;color:#2e7d32}
.ab-copy:hover{background:#2e7d32;color:#fff}
.ab-folder {background:#fff;border-color:#5d4037;color:#5d4037}
.ab-folder:hover{background:#5d4037;color:#fff}
.ab-info   {background:#fff;border-color:#37474f;color:#37474f}
.ab-info:hover{background:#37474f;color:#fff}
.ab-del    {background:#fff;border-color:#c62828;color:#c62828}
.ab-del:hover{background:#c62828;color:#fff}

/* ── Converting spinner ── */
.cvwrap{display:flex;align-items:center;gap:8px;font-size:12px;color:#7b1fa2}
.cvbar{background:#e1bee7;border-radius:4px;height:3px;flex:1;overflow:hidden}
.cvfill{background:#7b1fa2;height:100%;width:0%;animation:pggo 4s ease-in-out forwards}

/* ── Preview panel ── */
.prev{
  background:#f8f9fa;border:1px solid #e8eaed;border-radius:8px;
  padding:10px 12px;font-size:12px;color:#1f2328;
  max-height:220px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-word;font-family:monospace;
}
.prev img{max-width:100%;border-radius:6px;display:block}
.prev::-webkit-scrollbar{width:4px}
.prev::-webkit-scrollbar-thumb{background:#d0d7de;border-radius:4px}

/* ── Suggestions ── */
.suggs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.schip{
  padding:4px 10px;background:#f0f2f5;border:1px solid #dadce0;
  border-radius:20px;font-size:11.5px;cursor:pointer;color:#5f6368;
  transition:background .12s,border-color .12s,color .12s;
}
.schip:hover{background:#e8f0fe;border-color:#1565c0;color:#1565c0}

/* ── No results ── */
.nores{text-align:center;padding:16px;color:#9aa0a6;font-size:13px}
.nores .ni{font-size:34px;display:block;margin-bottom:8px}

/* ── Input area ── */
.ia{
  padding:8px 10px;border-top:1px solid #f0f2f5;
  display:flex;gap:6px;align-items:flex-end;background:#fff;flex-shrink:0;
}
.cinput{
  flex:1;border:1.5px solid #e8eaed;border-radius:20px;
  padding:7px 13px;font-size:13px;outline:none;resize:none;
  max-height:80px;overflow-y:auto;font-family:inherit;
  transition:border-color .13s;line-height:1.5;background:#f8f9fa;
}
.cinput:focus{border-color:#1565c0;background:#fff}
.cinput::placeholder{color:#c0c6cc}
.cinput:disabled{background:#f0f2f5}

.bsend{
  width:36px;height:36px;border-radius:50%;background:#1565c0;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;flex-shrink:0;transition:background .13s,transform .1s;
}
.bsend:hover{background:#0d47a1;transform:scale(1.05)}
.bsend:disabled{background:#dadce0;cursor:not-allowed;transform:none}

/* ── Mic button ── */
.bmic{
  width:36px;height:36px;border-radius:50%;
  background:#f8f9fa;border:1.5px solid #e8eaed;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  transition:background .13s,border-color .13s,transform .1s;
  position:relative;
}
.bmic:hover{background:#fce4ec;border-color:#e53935;transform:scale(1.05)}
.bmic.listening{
  background:#e53935;border-color:#e53935;
  animation:mic-pulse 1.2s ease-in-out infinite;
}
.bmic.listening::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid #e53935;opacity:.5;
  animation:mic-ring 1.2s ease-in-out infinite;
}
@keyframes mic-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.5)}
  50%{box-shadow:0 0 0 8px rgba(229,57,53,0)}
}
@keyframes mic-ring{
  0%{transform:scale(1);opacity:.6}
  100%{transform:scale(1.6);opacity:0}
}
.bmic:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ── Voice status bar ── */
.voice-bar{
  padding:6px 14px;background:#fce4ec;border-top:1px solid #f8bbd0;
  font-size:12px;color:#c62828;display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.voice-bar .vdots{display:flex;gap:3px;align-items:center}
.voice-bar .vdots span{
  width:5px;height:5px;border-radius:50%;background:#e53935;
  animation:vbounce .7s infinite;
}
.voice-bar .vdots span:nth-child(2){animation-delay:.15s}
.voice-bar .vdots span:nth-child(3){animation-delay:.3s}
@keyframes vbounce{0%,60%,100%{height:5px}30%{height:13px}}

/* ── Mic button in translate panel ── */
.tr-mic{
  width:32px;height:32px;border-radius:50%;
  background:#fff;border:1.5px solid #dadce0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:background .13s,border-color .13s;flex-shrink:0;
}
.tr-mic:hover{background:#fce4ec;border-color:#e53935}
.tr-mic.listening{background:#e53935;border-color:#e53935;animation:mic-pulse 1.2s infinite}

/* ── Toast ── */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:rgba(32,33,36,.88);color:#fff;padding:8px 16px;
  border-radius:8px;font-size:12.5px;z-index:10000;
  animation:tfade 2.8s ease forwards;pointer-events:none;
  white-space:nowrap;max-width:340px;text-align:center;
}
@keyframes tfade{
  0%  {opacity:0;transform:translateX(-50%) translateY(8px)}
  12% {opacity:1;transform:translateX(-50%) translateY(0)}
  75% {opacity:1}
  100%{opacity:0}
}

/* ── Stats panel ── */
.stats{
  padding:12px 14px;background:#f8f9fa;border-bottom:1px solid #f0f2f5;
  font-size:11.5px;color:#5f6368;display:flex;flex-wrap:wrap;gap:10px;
  flex-shrink:0;
}
.stat-item{display:flex;align-items:center;gap:5px}
.stat-item strong{color:#1f2328;font-weight:700}

/* ── Welcome card ── */
.wcard{
  background:linear-gradient(135deg,#e3f2fd,#f3e5f5);
  border-radius:12px;padding:14px;
}
.wcard h4{font-size:14px;font-weight:700;color:#1565c0;margin-bottom:6px}
.wcard ul{list-style:none;font-size:12.5px;color:#37474f;display:flex;flex-direction:column;gap:4px}
.wcard ul li::before{content:"";margin-right:4px}

/* ── Divider ── */
.divider{
  text-align:center;font-size:10px;color:#9aa0a6;
  padding:2px 0;display:flex;align-items:center;gap:6px;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e8eaed}

/* ── Tab bar — icon + tiny label ── */
.tabbar{
  display:flex;border-bottom:1px solid #eef0f3;flex-shrink:0;background:#fafbfc;
}
.tab{
  flex:1;padding:7px 2px 6px;font-size:10px;font-weight:600;
  border:none;background:none;cursor:pointer;color:#9aa0a6;
  border-bottom:2px solid transparent;transition:color .1s,border-color .1s;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.tab .ti{font-size:15px;line-height:1}
.tab.active{color:#1565c0;border-bottom-color:#1565c0}
.tab:hover{color:#1565c0;background:#f0f4ff}

/* ── Translate panel ── */
.trpanel{
  flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;
}
.trpanel::-webkit-scrollbar{width:4px}
.trpanel::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}

.tr-selrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr-sel{
  flex:1;min-width:100px;padding:7px 10px;border:1.5px solid #dadce0;border-radius:10px;
  font-size:13px;background:#fff;cursor:pointer;outline:none;font-family:inherit;
  transition:border-color .15s;
}
.tr-sel:focus{border-color:#1565c0}
.tr-swap{
  width:32px;height:32px;border-radius:50%;border:1.5px solid #dadce0;
  background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;
  justify-content:center;transition:background .12s,border-color .12s;flex-shrink:0;
}
.tr-swap:hover{background:#e8f0fe;border-color:#1565c0}

.tr-box{
  border:1.5px solid #dadce0;border-radius:12px;overflow:hidden;
  transition:border-color .15s;
}
.tr-box:focus-within{border-color:#1565c0}
.tr-box-hdr{
  padding:6px 12px;background:#f8f9fa;border-bottom:1px solid #e8eaed;
  font-size:11px;font-weight:600;color:#5f6368;display:flex;justify-content:space-between;align-items:center;
}
.tr-box-hdr span{color:#9aa0a6;font-weight:400;font-size:10.5px}
.tr-textarea{
  width:100%;padding:10px 12px;border:none;outline:none;resize:none;
  font-size:13.5px;font-family:inherit;line-height:1.6;min-height:80px;
  background:#fff;
}
.tr-result{
  padding:10px 12px;font-size:13.5px;line-height:1.6;min-height:60px;
  color:#1f2328;background:#f8fbff;white-space:pre-wrap;word-break:break-word;
}
.tr-result.loading{color:#9aa0a6;font-style:italic}

.tr-actions{display:flex;gap:6px;flex-wrap:wrap}
.tr-btn{
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;
  cursor:pointer;border:1.5px solid;transition:background .13s,color .13s;
  display:flex;align-items:center;gap:5px;
}
.tr-btn.primary{background:#1565c0;border-color:#1565c0;color:#fff}
.tr-btn.primary:hover{background:#0d47a1}
.tr-btn.primary:disabled{background:#dadce0;border-color:#dadce0;cursor:not-allowed}
.tr-btn.sec{background:#fff;border-color:#dadce0;color:#5f6368}
.tr-btn.sec:hover{border-color:#1565c0;color:#1565c0}

.tr-history{display:flex;flex-direction:column;gap:6px}
.tr-hist-item{
  background:#f0f2f5;border-radius:10px;padding:8px 11px;font-size:12px;
  cursor:pointer;transition:background .1s;
}
.tr-hist-item:hover{background:#e8f0fe}
.tr-hist-src{color:#5f6368;font-size:11px;margin-bottom:3px}
.tr-hist-pair{display:flex;gap:6px;align-items:flex-start}
.tr-hist-orig{color:#1f2328;flex:1}
.tr-hist-arrow{color:#9aa0a6;flex-shrink:0}
.tr-hist-trsl{color:#1565c0;flex:1}

.tr-langs-quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tr-lang-chip{
  padding:3px 9px;background:#f0f2f5;border:1px solid #dadce0;
  border-radius:20px;font-size:11px;cursor:pointer;color:#5f6368;
  transition:background .1s,border-color .1s;
}
.tr-lang-chip:hover{background:#e8f0fe;border-color:#1565c0;color:#1565c0}
.tr-lang-chip.active{background:#e8f0fe;border-color:#1565c0;color:#1565c0}

/* ── Translate button in action bar ── */
.ab-tr{background:#fff;border-color:#00838f;color:#00838f}
.ab-tr:hover{background:#00838f;color:#fff}

/* ── Advanced search panel ── */
.advpanel{
  padding:8px 12px 10px;border-bottom:1px solid #f0f2f5;
  background:#fafbfc;display:flex;flex-direction:column;gap:6px;flex-shrink:0;
  font-size:12px;
}
.advpanel-title{font-weight:700;color:#5f6368;font-size:11px;margin-bottom:2px}
.advrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.adv-lbl{font-size:10.5px;color:#9aa0a6;white-space:nowrap;min-width:30px}
.advinput{
  flex:1;min-width:70px;padding:4px 8px;border:1.5px solid #dadce0;border-radius:8px;
  font-size:12px;outline:none;font-family:inherit;background:#fff;
  transition:border-color .13s;
}
.advinput:focus{border-color:#1565c0}
.advclear{
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  border:1.5px solid #ef6c00;color:#ef6c00;background:#fff;cursor:pointer;
}
.advclear:hover{background:#ef6c00;color:#fff}

/* ── File Browser ── */
.fbrowser{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:#fff}
.fbrowser::-webkit-scrollbar{width:4px}
.fbrowser::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}
.fb-crumb{
  font-size:10.5px;color:#5f6368;padding:2px 0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;
}
.fb-item{
  display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:8px;
  cursor:pointer;transition:background .1s;
}
.fb-item:hover{background:#f0f2f5}
.fb-ic{font-size:16px;flex-shrink:0;line-height:1}
.fb-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const FMT_TIME = (d=new Date()) =>
  d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});

// ── Device detection ─────────────────────────────────────────────────────────
// isLocalHost: true khi truy cập từ cùng máy chủ chạy Node (localhost / 127.x)
// isTouch    : true khi là thiết bị cảm ứng (mobile/tablet)
// isDesktop  : true khi KHÔNG phải touch device
const isLocalHost = () => {
  const h = window.location.hostname;
  return h === 'localhost' || h === '127.0.0.1' || h.startsWith('192.168.') || h.startsWith('10.');
};
const isTouch = () => window.matchMedia('(hover:none) and (pointer:coarse)').matches;
// Quyền hạn: các hành động mở file / thư mục chỉ có nghĩa trên máy chạy server
// Nếu truy cập từ mạng LAN / internet → vẫn hiện nút nhưng server sẽ mở file TẠI MÁY CHỦ
// => ta chỉ ẩn trên thiết bị cảm ứng (không có file explorer), còn LAN desktop vẫn dùng được nếu muốn
const DEVICE = {
  isTouch:    isTouch(),
  isLocal:    isLocalHost(),
  // canOpenFile: cho phép các nút MỞ / CHỈNH SỬA / THƯ MỤC / CONVERT
  // (ẩn trên mobile/tablet vì họ không có Windows Explorer)
  canOpenFile: !isTouch(),
};

// ── Vietnamese normalization for smart search ────────────────────────────────
function vi2plain(s='') {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/gi,'d').toLowerCase().trim();
}

// ── Intent parser ────────────────────────────────────────────────────────────
const SEARCH_KW = ['tìm','kiếm','search','lấy','xem','mở','có không','đâu','file','tệp','tài liệu','danh sách'];
function isSearch(t){ const l=t.toLowerCase(); return SEARCH_KW.some(k=>l.includes(k)); }

function extractQ(text) {
  const pats = [
    /tìm(?:\s+(?:cho\s+tôi|giúp\s+tôi))?(?:\s+(?:file|tệp|tài\s+liệu))?\s+(?:(?:có\s+)?(?:tên|tên\s+là)\s+)?[""""]?([^""""\n?!]+)/i,
    /(?:file|tệp|tài\s*liệu)\s+(?:tên\s+)?[""""]?([^""""\n?!]+)/i,
    /(?:kiếm|search)\s+[""""]?([^""""\n?!]+)/i,
    /[""""]([^""""\n]+)[""""]/, // quoted
    /(.+)/,
  ];
  for (const re of pats) {
    const m = text.match(re);
    if (m) return m[1].replace(/[""""\?!.,]+$/,'').trim();
  }
  return text.trim();
}

// ── EXT filter groups ────────────────────────────────────────────────────────
const FILTERS = [
  { label:'Tất cả', val:'',        icon:'🗂' },
  { label:'PDF',    val:'.pdf',     icon:'📄' },
  { label:'Word',   val:'.docx,.doc', icon:'📝' },
  { label:'Excel',  val:'.xlsx,.xls', icon:'📊' },
  { label:'Ảnh',    val:'.jpg,.jpeg,.png,.gif,.bmp,.tiff', icon:'🖼️' },
  { label:'PPT',    val:'.pptx,.ppt', icon:'📑' },
  { label:'Video',  val:'.mp4,.avi,.mov,.mkv', icon:'🎬' },
];

// ── FileCard ─────────────────────────────────────────────────────────────────
function FileCard({ file, onSelect, selected }) {
  return (
    <div className={`fcard${selected?' sel':''}`} onClick={()=>onSelect(file)} title={file.path}>
      <div className="fic">{file.icon}</div>
      <div className="fi">
        <div className="fname">{file.name}</div>
        <div className="fdir">📁 {file.dir||'/'}</div>
        <div className="fmeta">
          <span>{(file.ext||'').toUpperCase().replace('.','') || 'FILE'}</span>
          <span>{file.size}</span>
          <span>📅 {file.modified}</span>
        </div>
      </div>
      <div className="sbadge">{Math.min(file.score||0,100)}%</div>
    </div>
  );
}

// ── ActionBar ─────────────────────────────────────────────────────────────────
function ActionBar({ file, onAction, loading, serverIsLocal }) {
  const ext  = (file.ext||'').toLowerCase();
  const isPDF = ext==='.pdf';
  const isDoc = ['.docx','.doc'].includes(ext);
  const isImg = ['.jpg','.jpeg','.png','.gif','.bmp','.tiff','.tif','.webp'].includes(ext);
  const isXls = ['.xlsx','.xls','.csv'].includes(ext);
  const isTxt = ['.txt','.csv'].includes(ext);
  const canRead = isImg||isDoc||isXls||isTxt;
  // canOpen: show file-open buttons only on non-touch devices
  // On LAN desktop: show them (server will open on server machine, which is expected)
  // On mobile/tablet: hide them (no file system access)
  const canOpen = DEVICE.canOpenFile; // false on mobile/tablet

  return (
    <div className="abar">
      {canRead && (
        <button className="abtn ab-read" onClick={()=>onAction('read',file)} disabled={!!loading}>
          👁 ĐỌC
        </button>
      )}
      {/* Windows-only actions: hidden on touch devices */}
      {canOpen && (
        <button className="abtn ab-open" onClick={()=>onAction('open',file)} disabled={!!loading}>
          🚀 MỞ
        </button>
      )}
      {canOpen && (
        <button className="abtn ab-edit" onClick={()=>onAction('edit',file)} disabled={!!loading}>
          ✏️ CHỈNH SỬA
        </button>
      )}
      {canOpen && isPDF && (
        <button className="abtn ab-cv" onClick={()=>onAction('pdf2word',file)} disabled={!!loading}>
          🔄 PDF→WORD
        </button>
      )}
      {canOpen && isDoc && (
        <button className="abtn ab-cv" onClick={()=>onAction('word2pdf',file)} disabled={!!loading}>
          🔄 WORD→PDF
        </button>
      )}
      <button className="abtn ab-tr" onClick={()=>onAction('translate',file)} disabled={!!loading}>
        🌐 DỊCH TÊN
      </button>
      <button className="abtn ab-copy" onClick={()=>onAction('copypath',file)} disabled={!!loading}>
        📋 SAO CHÉP
      </button>
      {canOpen && (
        <button className="abtn ab-folder" onClick={()=>onAction('folder',file)} disabled={!!loading}>
          📂 THƯ MỤC
        </button>
      )}
      <button className="abtn ab-info" onClick={()=>onAction('info',file)} disabled={!!loading}>
        ℹ️ THÔNG TIN
      </button>
      {/* Touch note: show only on mobile */}
      {!canOpen && (
        <div className="touch-note" style={{display:'flex'}}>
          ℹ️ Mở file & chuyển đổi chỉ hỗ trợ trên máy tính
        </div>
      )}
    </div>
  );
}

// ── Message renderer ──────────────────────────────────────────────────────────
function Msg({ msg, onFileSelect, selFile, onSuggest, serverIsLocal }) {
  const [actLoading, setActLoading] = useState('');

  if (msg.type==='user') return (
    <div className="mrow user">
      <div className="mav">👤</div>
      <div>
        <div className="bub">{msg.text}</div>
        <div className="mt">{msg.time}</div>
      </div>
    </div>
  );

  if (msg.type==='typing') return (
    <div className="mrow bot">
      <div className="mav">🤖</div>
      <div className="bub" style={{padding:'7px 12px'}}>
        <div className="dots"><span/><span/><span/></div>
      </div>
    </div>
  );

  if (msg.type==='scanning') return (
    <div className="mrow bot">

  if (msg.type==='welcome') return (

}

// ── Translate function (MyMemory API — free, no key) ─────────────────────────
async function doTranslate(text, srcLang, tgtLang) {
  if (!text.trim()) return '';
  // MyMemory free API: 1000 req/day, 500 chars/req
  const chunks = [];
  for (let i = 0; i < text.length; i += 480) chunks.push(text.slice(i, i+480));

  const results = [];
  for (const chunk of chunks) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=${srcLang}|${tgtLang}`;
    const r = await fetch(url);
    const d = await r.json();
    if (d.responseStatus !== 200) throw new Error(d.responseDetails || 'Lỗi API dịch');
    results.push(d.responseData.translatedText);
  }
  return results.join(' ');
}

// ── TranslatePanel ────────────────────────────────────────────────────────────
function TranslatePanel({ onTranslateToChat, initText = '', initSrc = 'vi', initTgt = 'en' }) {
  const [srcLang,  setSrcLang]  = useState(initSrc);
  const [tgtLang,  setTgtLang]  = useState(initTgt);
  const [srcText,  setSrcText]  = useState(initText);
  const [result,   setResult]   = useState('');
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState('');
  const [history,  setHistory]  = useState([]);

  // Voice input for source text
  const voice = useVoiceInput(LANG_SPEECH[srcLang] || 'vi-VN');

  // re-init when external text changes (from file action)
  useEffect(()=>{ setSrcText(initText); setSrcLang(initSrc); setTgtLang(initTgt); setResult(''); },[initText,initSrc,initTgt]);

  // sync voice transcript → srcText
  useEffect(()=>{ if (voice.transcript) setSrcText(voice.transcript.trim()); },[voice.transcript]);

  // auto-translate when voice stops (ref trick to avoid stale closure)
  const translateRef = useRef(null);

  useEffect(()=>{
    if (!voice.listening && voice.transcript.trim()) {
      const txt = voice.transcript.trim();
      setSrcText(txt);
      setTimeout(()=>{ if (translateRef.current) translateRef.current(); }, 400);
    }
  }, [voice.listening]);

  const swap = () => {
    setSrcLang(tgtLang);
    setTgtLang(srcLang);
    setSrcText(result);
    setResult(srcText);
  };

  const translate = async () => {
    const txt = srcText.trim();
    if (!txt) return;
    setLoading(true);
    setError('');
    try {
      const out = await doTranslate(txt, srcLang, tgtLang);
      setResult(out);
      setHistory(h => [{ srcLang, tgtLang, orig: txt.slice(0,80), trsl: out.slice(0,80) }, ...h.slice(0,9)]);
    } catch(e) {
      setError('❌ ' + e.message);
    } finally {
      setLoading(false);
    }
  };

  // keep ref in sync
  useEffect(()=>{ translateRef.current = translate; });

  const copyResult = async () => {
    try { await navigator.clipboard.writeText(result); }
    catch { /* ignore */ }
  };

  const sendToChat = () => {
    if (result && onTranslateToChat) {
      const sName = LANGS.find(l=>l.code===srcLang)?.name || srcLang;
      const tName = LANGS.find(l=>l.code===tgtLang)?.name || tgtLang;
      onTranslateToChat(`🌐 Dịch (${sName} → ${tName}):\n\n📝 Gốc: ${srcText}\n\n✅ Dịch: ${result}`);
    }
  };

  const setQuick = (pair) => {
    setSrcLang(pair.src);
    setTgtLang(pair.tgt);
  };

  const srcFlag = LANGS.find(l=>l.code===srcLang)?.flag||'🌐';
  const tgtFlag = LANGS.find(l=>l.code===tgtLang)?.flag||'🌐';

  return (
    <div className="trpanel">
      {/* Quick pairs */}
      <div>
        <div style={{fontSize:11,color:'#9aa0a6',marginBottom:5,fontWeight:600}}>NHANH:</div>
        <div className="tr-langs-quick">
          {QUICK_PAIRS.map(p=>(
            <button key={p.label}
              className={`tr-lang-chip${srcLang===p.src&&tgtLang===p.tgt?' active':''}`}
              onClick={()=>setQuick(p)}>
              {p.label}
            </button>
          ))}
        </div>
      </div>

      {/* Lang selector row */}
      <div className="tr-selrow">
        <select className="tr-sel" value={srcLang} onChange={e=>setSrcLang(e.target.value)}>
          {LANGS.map(l=><option key={l.code} value={l.code}>{l.flag} {l.name}</option>)}
        </select>
        <button className="tr-swap" onClick={swap} title="Đổi chiều dịch">⇄</button>
        <select className="tr-sel" value={tgtLang} onChange={e=>setTgtLang(e.target.value)}>
          {LANGS.map(l=><option key={l.code} value={l.code}>{l.flag} {l.name}</option>)}
        </select>
      </div>

      {/* Source box */}
      <div className="tr-box" style={voice.listening ? {borderColor:'#e53935'} : {}}>
        <div className="tr-box-hdr">
          {srcFlag} Văn bản nguồn
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span>{srcText.length}/2000 ký tự</span>
            {voice.supported && (
              <button
                className={`tr-mic${voice.listening?' listening':''}`}
                onClick={()=>{
                  if (voice.listening) { voice.stop(); }
                  else { voice.reset(); setSrcText(''); voice.toggle(); }
                }}
                title={voice.listening ? 'Dừng — tự động dịch' : 'Nói văn bản nguồn'}>
                {voice.listening ? '⏹' : '🎤'}
              </button>
            )}
          </div>
        </div>
        {voice.listening && (
          <div style={{padding:'4px 12px',fontSize:11.5,color:'#e53935',display:'flex',alignItems:'center',gap:6,background:'#fff8f8'}}>
            <span style={{animation:'mic-pulse 1s infinite',display:'inline-block'}}>🔴</span>
            {voice.interimText ? `"${voice.interimText}"` : 'Đang nghe...'}
          </div>
        )}
        <textarea className="tr-textarea"
          placeholder={voice.listening ? '🎤 Đang nghe...' : 'Nhập văn bản hoặc nhấn 🎤 để nói...'}
          value={voice.listening
            ? (voice.transcript + (voice.interimText ? ' '+voice.interimText : ''))
            : srcText}
          onChange={e=>{ if(!voice.listening) setSrcText(e.target.value.slice(0,2000)); }}
          onKeyDown={e=>{ if(e.ctrlKey&&e.key==='Enter'){ e.preventDefault(); translate(); } }}
          rows={4}
          style={voice.listening ? {background:'#fff8f8',color:'#c62828'} : {}}/>
      </div>

      {/* Translate button */}
      <div className="tr-actions">
        <button className="tr-btn primary" onClick={translate} disabled={loading||!srcText.trim()}>
          {loading ? <><span style={{animation:'spin 1s linear infinite',display:'inline-block'}}>⚙️</span> Đang dịch...</> : '🌐 Dịch (Ctrl+Enter)'}
        </button>
        {result && (
          <>
            <button className="tr-btn sec" onClick={copyResult} title="Sao chép kết quả">📋 Sao chép</button>
            <button className="tr-btn sec" onClick={swap} title="Đảo chiều">⇄ Đảo chiều</button>
            <button className="tr-btn sec" onClick={sendToChat} title="Gửi vào chat">💬 Vào chat</button>
          </>
        )}
        {srcText && <button className="tr-btn sec" onClick={()=>{setSrcText('');setResult('');setError('');}}>✕ Xoá</button>}
      </div>

      {/* Result box */}
      <div className="tr-box">
        <div className="tr-box-hdr">
          {tgtFlag} Kết quả dịch
          {result && <span>{result.length} ký tự</span>}
        </div>
        <div className={`tr-result${loading?' loading':''}`}>
          {loading ? 'Đang dịch...' : error || result || <span style={{color:'#bdc1c6'}}>Kết quả sẽ hiển thị tại đây</span>}
        </div>
      </div>

      {/* History */}
      {history.length > 0 && (
        <div>
          <div style={{fontSize:11,color:'#9aa0a6',marginBottom:6,fontWeight:600}}>LỊCH SỬ DỊCH:</div>
          <div className="tr-history">
            {history.map((h,i)=>(
              <div key={i} className="tr-hist-item"
                onClick={()=>{ setSrcText(h.orig); setSrcLang(h.srcLang); setTgtLang(h.tgtLang); setResult(h.trsl); }}>
                <div className="tr-hist-src">
                  {LANGS.find(l=>l.code===h.srcLang)?.flag} {h.srcLang.toUpperCase()} → {LANGS.find(l=>l.code===h.tgtLang)?.flag} {h.tgtLang.toUpperCase()}
                </div>
                <div className="tr-hist-pair">
                  <span className="tr-hist-orig">{h.orig}{h.orig.length>=80?'…':''}</span>
                  <span className="tr-hist-arrow">→</span>
                  <span className="tr-hist-trsl">{h.trsl}{h.trsl.length>=80?'…':''}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{fontSize:11,color:'#bdc1c6',textAlign:'center',paddingTop:4}}>
        Powered by MyMemory API · Miễn phí · Không cần đăng nhập
      </div>
    </div>
  );
}

// ── Secure context check ──────────────────────────────────────────────────────
// Web Speech API requires a secure context (HTTPS or localhost).
// On LAN (192.168.x / 10.x) over plain HTTP it will always be blocked.
const IS_SECURE = window.isSecureContext;
const MIC_FIX_HINT = (() => {
  const h = window.location.hostname;
  const isLAN = h.startsWith('192.168.') || h.startsWith('10.') || h.startsWith('172.');
  if (!IS_SECURE && isLAN)
    return `Trang đang mở qua HTTP trên mạng LAN → trình duyệt tự chặn micro.\n\nCách mở khoá:\n• Chrome: vào chrome://flags → tìm "Insecure origins treated as secure" → thêm http://${h}:PORT → Relaunch\n• Hoặc truy cập qua https:// nếu server có SSL\n• Hoặc dùng từ máy chủ: http://localhost:PORT (luôn được phép)`;
  if (!IS_SECURE)
    return 'Micro chỉ hoạt động trên HTTPS hoặc localhost. Hãy truy cập qua https://.';
  return null;
})();

// ── useVoiceInput hook ────────────────────────────────────────────────────────
// Wraps Web Speech API (SpeechRecognition). Works in Chrome/Edge on HTTPS/localhost.
// lang: BCP-47 tag, e.g. 'vi-VN', 'en-US', 'zh-CN', etc.
function useVoiceInput(lang = 'vi-VN') {
  const [listening,   setListening]   = useState(false);
  const [transcript,  setTranscript]  = useState('');
  const [interimText, setInterimText] = useState('');
  const [error,       setError]       = useState('');
  const [permState,   setPermState]   = useState('unknown'); // 'granted'|'denied'|'prompt'|'unknown'
  const [supported,   setSupported]   = useState(false);
  const recRef = useRef(null);

  // ── Check mic permission state via Permissions API ──
  useEffect(() => {
    if (!navigator.permissions) return;
    navigator.permissions.query({ name: 'microphone' })
      .then(s => {
        setPermState(s.state);
        s.onchange = () => setPermState(s.state);
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    setSupported(true);
    const rec = new SR();
    rec.continuous      = true;
    rec.interimResults  = true;
    rec.maxAlternatives = 1;
    rec.lang = lang;

    rec.onstart = () => { setListening(true); setError(''); };
    rec.onend   = () => { setListening(false); setInterimText(''); };
    rec.onerror = (e) => {
      setListening(false);
      setInterimText('');
      if (e.error === 'not-allowed') {
        setPermState('denied');
        // Show context-aware fix hint
        if (MIC_FIX_HINT) {
          setError(MIC_FIX_HINT);
        } else {
          setError(
            'Microphone bị chặn.\n\n' +
            'Cách mở khoá:\n' +
            '① Nhấn vào biểu tượng 🔒 hoặc ℹ️ trên thanh địa chỉ\n' +
            '② Tìm mục "Microphone" → chọn "Cho phép"\n' +
            '③ Tải lại trang (F5)'
          );
        }
      } else if (e.error === 'no-speech') {
        setError('Không nghe thấy tiếng. Hãy nói to hơn hoặc kiểm tra micro.');
      } else if (e.error === 'network') {
        setError('Lỗi mạng khi nhận dạng giọng nói. Kiểm tra kết nối internet.');
      } else if (e.error === 'aborted') {
        // user aborted — not an error
      } else {
        setError(`Lỗi nhận dạng: ${e.error}`);
      }
    };
    rec.onresult = (e) => {
      let interim = '';
      let final   = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t + ' ';
        else interim += t;
      }
      if (final)   setTranscript(prev => (prev + final).trimStart());
      if (interim) setInterimText(interim);
    };

    recRef.current = rec;
    return () => { try { rec.stop(); } catch {} };
  }, [lang]);

  // Update lang without recreating
  useEffect(() => {
    if (recRef.current) recRef.current.lang = lang;
  }, [lang]);

  const start = useCallback(() => {
    if (!recRef.current || listening) return;
    // Warn immediately if we already know it's blocked
    if (!IS_SECURE) {
      setError(MIC_FIX_HINT || 'Micro yêu cầu HTTPS hoặc localhost.');
      return;
    }
    setTranscript('');
    setInterimText('');
    setError('');
    try { recRef.current.start(); } catch {}
  }, [listening]);

  const stop = useCallback(() => {
    if (!recRef.current || !listening) return;
    try { recRef.current.stop(); } catch {}
  }, [listening]);

  const toggle = useCallback(() => {
    listening ? stop() : start();
  }, [listening, start, stop]);

  const reset = useCallback(() => {
    setTranscript('');
    setInterimText('');
    setError('');
  }, []);

  return { listening, transcript, interimText, error, permState, supported, toggle, stop, reset, setTranscript };
}

// ── Lang code → BCP-47 speech tag ────────────────────────────────────────────
const LANG_SPEECH = {
  vi:'vi-VN', en:'en-US', zh:'zh-CN', ja:'ja-JP', ko:'ko-KR',
  fr:'fr-FR', de:'de-DE', es:'es-ES', th:'th-TH', ru:'ru-RU',
  ar:'ar-SA', pt:'pt-BR',
};

// ── Intent: detect translate command ─────────────────────────────────────────
function parseTranslateCmd(text) {
  // "dịch [text] sang [lang]"  or  "translate [text] to [lang]"
  const m1 = text.match(/(?:dịch|translate)\s+(.+?)\s+(?:sang|to|qua)\s+(.+)/i);
  if (m1) {
    const langMap = {
      'anh':'en','english':'en','tiếng anh':'en',
      'việt':'vi','vietnamese':'vi','tiếng việt':'vi',
      'trung':'zh','chinese':'zh','tiếng trung':'zh','tàu':'zh',
      'nhật':'ja','japanese':'ja','tiếng nhật':'ja',
      'hàn':'ko','korean':'ko','tiếng hàn':'ko',
      'pháp':'fr','french':'fr','tiếng pháp':'fr',
      'đức':'de','german':'de','tiếng đức':'de',
      'tây ban nha':'es','spanish':'es',
      'thái':'th','thai':'th','tiếng thái':'th',
      'nga':'ru','russian':'ru','tiếng nga':'ru',
    };
    const tgtKey = m1[2].toLowerCase().trim();
    const tgt = langMap[tgtKey] || tgtKey.slice(0,2);
    return { text: m1[1].trim(), tgt };
  }
  return null;
}

// ── useAI hook — manages AI config stored in localStorage ────────────────────
function useAI() {
  const load = () => {
    try {
      const s = localStorage.getItem('aiConfig');
      return s ? JSON.parse(s) : { provider:'groq', model:'', apiKey:'', baseUrl:'', enabled:false };
    } catch { return { provider:'groq', model:'', apiKey:'', baseUrl:'', enabled:false }; }
  };

  const [cfg, setCfgRaw] = useState(load);

  const setCfg = useCallback(next => {
    setCfgRaw(next);
    try { localStorage.setItem('aiConfig', JSON.stringify(next)); } catch {}
  }, []);

  // aiHistory for multi-turn context (role/content pairs sent to AI)
  const [aiHistory, setAiHistory] = useState([]);

  const callAI = useCallback(async (message, fileContext = '') => {
    if (!cfg.enabled || !cfg.apiKey) return null;
    const body = {
      message,
      history: aiHistory,
      fileContext,
      provider: cfg.provider,
      model:    cfg.model || undefined,
      apiKey:   cfg.apiKey,
      baseUrl:  cfg.baseUrl || undefined,
    };
    const r = await fetch('/api/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    // append to history
    setAiHistory(h => [
      ...h.slice(-18),
      { role:'user',      content: message },
      { role:'assistant', content: d.reply },
    ]);
    return d.reply;
  }, [cfg, aiHistory]);

  const resetHistory = useCallback(() => setAiHistory([]), []);

  return { cfg, setCfg, callAI, resetHistory, aiHistory };
}
