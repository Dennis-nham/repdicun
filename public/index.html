// ── useHardware hook ─────────────────────────────────────────────────────────
// Provides unified access to device hardware APIs with graceful degradation.
function useHardware() {
  // ── Battery ──
  const [battery, setBattery] = useState(null); // { level, charging, chargingTime, dischargingTime }
  useEffect(() => {
    if (!navigator.getBattery) return;
    let bat;
    const update = b => setBattery({
      level: Math.round(b.level * 100),
      charging: b.charging,
      chargingTime: b.chargingTime,
      dischargingTime: b.dischargingTime,
    });
    navigator.getBattery().then(b => {
      bat = b;
      update(b);
      b.addEventListener('levelchange', () => update(b));
      b.addEventListener('chargingchange', () => update(b));
    });
    return () => { if (bat) { bat.removeEventListener('levelchange', ()=>{}); bat.removeEventListener('chargingchange', ()=>{}); } };
  }, []);

  // ── Network ──
  const [network, setNetwork] = useState(() => {
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return c ? { type: c.effectiveType || c.type, downlink: c.downlink, rtt: c.rtt, saveData: c.saveData, online: navigator.onLine } : { online: navigator.onLine };
  });
  useEffect(() => {
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const update = () => setNetwork({
      type: c?.effectiveType || c?.type || '?',
      downlink: c?.downlink,
      rtt: c?.rtt,
      saveData: c?.saveData,
      online: navigator.onLine,
    });
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    if (c) c.addEventListener('change', update);
    return () => {
      window.removeEventListener('online', update);
      window.removeEventListener('offline', update);
      if (c) c.removeEventListener('change', update);
    };
  }, []);

  // ── Geolocation ──
  const [geo, setGeo] = useState(null);   // { lat, lng, accuracy, timestamp } | 'denied' | null
  const requestGeo = useCallback(() => {
    if (!navigator.geolocation) { setGeo('unsupported'); return; }
    navigator.geolocation.getCurrentPosition(
      pos => setGeo({ lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5), accuracy: Math.round(pos.coords.accuracy), timestamp: new Date(pos.timestamp).toLocaleTimeString('vi-VN') }),
      err => setGeo(err.code === 1 ? 'denied' : 'error'),
      { enableHighAccuracy: true, timeout: 10000 }
    );
    setGeo('loading');
  }, []);

  // ── Screen Wake Lock ──
  const [wakeLock, setWakeLock]     = useState(null);
  const [wakeActive, setWakeActive] = useState(false);
  const toggleWakeLock = useCallback(async () => {
    if (!('wakeLock' in navigator)) return;
    if (wakeActive && wakeLock) {
      await wakeLock.release();
      setWakeLock(null); setWakeActive(false);
    } else {
      try {
        const wl = await navigator.wakeLock.request('screen');
        wl.addEventListener('release', () => setWakeActive(false));
        setWakeLock(wl); setWakeActive(true);
      } catch {}
    }
  }, [wakeActive, wakeLock]);

  // ── Vibration ──
  const vibrate = useCallback((pattern = [100]) => {
    if ('vibrate' in navigator) navigator.vibrate(pattern);
  }, []);

  // ── Device orientation ──
  const [orient, setOrient] = useState(() => screen.orientation?.type || '?');
  useEffect(() => {
    const h = () => setOrient(screen.orientation?.type || '?');
    screen.orientation?.addEventListener('change', h);
    return () => screen.orientation?.removeEventListener('change', h);
  }, []);

  // ── Device memory & CPU ──
  const hwInfo = {
    memory:     navigator.deviceMemory   ? `${navigator.deviceMemory} GB` : null,
    cpuCores:   navigator.hardwareConcurrency || null,
    platform:   navigator.platform || null,
    touchPoints: navigator.maxTouchPoints || 0,
    pixelRatio:  window.devicePixelRatio || 1,
    screenW:     screen.width,
    screenH:     screen.height,
  };

  return { battery, network, geo, requestGeo, wakeActive, toggleWakeLock, vibrate, orient, hwInfo };
}

// ── HardwarePanel ─────────────────────────────────────────────────────────────
function HardwarePanel({ onSendToChat }) {
  const { battery, network, geo, requestGeo, wakeActive, toggleWakeLock, vibrate, orient, hwInfo } = useHardware();
  const [camOn,    setCamOn]    = useState(false);
  const [qrResult, setQrResult] = useState('');
  const [qrErr,    setQrErr]    = useState('');
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const qrTimerRef = useRef(null);

  // ── Camera / QR ──────────────────────────────────────────────────────────
  const startCamera = useCallback(async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      streamRef.current = stream;
      if (videoRef.current) videoRef.current.srcObject = stream;
      setCamOn(true); setQrErr('');
      // Load jsQR lazily from CDN
      if (!window.jsQR) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
      }
      // Scan frame every 400ms
      const scan = () => {
        const v = videoRef.current;
        if (!v || !v.videoWidth) { qrTimerRef.current = setTimeout(scan, 400); return; }
        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth; canvas.height = v.videoHeight;
        canvas.getContext('2d').drawImage(v, 0, 0);
        const img = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(img.data, img.width, img.height);
        if (code) {
          setQrResult(code.data);
          vibrate([60, 40, 60]);
          stopCamera();
        } else {
          qrTimerRef.current = setTimeout(scan, 400);
        }
      };
      qrTimerRef.current = setTimeout(scan, 800);
    } catch(e) {
      setQrErr(e.name === 'NotAllowedError' ? 'Quyền camera bị từ chối. Hãy cho phép trong trình duyệt.' : e.message);
    }
  }, [vibrate]);

  const stopCamera = useCallback(() => {
    clearTimeout(qrTimerRef.current);
    streamRef.current?.getTracks().forEach(t => t.stop());
    setCamOn(false);
  }, []);

  useEffect(() => () => stopCamera(), [stopCamera]);

  // ── Battery color ──
  const battColor = battery ? (battery.level > 50 ? '#2e7d32' : battery.level > 20 ? '#f57f17' : '#c62828') : '#bbb';
  const wakeSupported = 'wakeLock' in navigator;
  const geoSupported  = 'geolocation' in navigator;
  const camSupported  = !!(navigator.mediaDevices?.getUserMedia);
  const vibSupported  = 'vibrate' in navigator;

  return (
    <div className="hwpanel">

      {/* ── Camera / QR Scanner ── */}
      <div className="hw-section">
        <div className="hw-sec-hdr">
          <span className="hw-icon">📷</span> Camera & QR Scanner
          <span className={`hw-st ${camSupported ? (camOn?'on':'off') : 'na'}`}>
            {camSupported ? (camOn ? 'Đang quét' : 'Sẵn sàng') : 'Không hỗ trợ'}
          </span>
        </div>
        <div className="hw-sec-body">
          {camOn && <video ref={videoRef} className="hw-cam" autoPlay playsInline muted/>}
          {qrResult && (
            <div className="hw-qr-result">
              ✅ <span style={{flex:1}}><strong>QR:</strong> {qrResult}</span>
              <button className="hw-btn sec" style={{fontSize:10.5}} onClick={()=>{ onSendToChat(`📷 QR scan: ${qrResult}`); setQrResult(''); }}>→ Chat</button>
            </div>
          )}
          {qrErr && <div style={{fontSize:11.5,color:'#c62828'}}>⚠️ {qrErr}</div>}
          <div className="hw-row">
            {!camOn ? (
              <button className="hw-btn primary" disabled={!camSupported} onClick={startCamera}>
                📷 Bật camera quét QR
              </button>
            ) : (
              <button className="hw-btn danger" onClick={stopCamera}>⏹ Tắt camera</button>
            )}
            {qrResult && <button className="hw-btn sec" onClick={()=>setQrResult('')}>✕ Xoá</button>}
          </div>
        </div>
      </div>

      {/* ── Battery ── */}
      <div className="hw-section">
        <div className="hw-sec-hdr">
          <span className="hw-icon">🔋</span> Pin
          <span className={`hw-st ${battery ? 'on' : 'na'}`}>{battery ? `${battery.level}%` : 'N/A'}</span>
        </div>
        {battery && (
          <div className="hw-sec-body">
            <div className="hw-row">
              <div className="hw-batt-bar">
                <div className="hw-batt-fill" style={{width:`${battery.level}%`, background: battColor}}/>
              </div>
              <span className="hw-val" style={{color: battColor}}>{battery.level}%</span>
            </div>
            <div className="hw-row">
              <span className="hw-lbl">Trạng thái</span>
              <span className="hw-val">{battery.charging ? '⚡ Đang sạc' : '🔋 Dùng pin'}</span>
            </div>
            {battery.charging && battery.chargingTime !== Infinity && (
              <div className="hw-row">
                <span className="hw-lbl">Đầy pin sau</span>
                <span className="hw-val">{Math.round(battery.chargingTime/60)} phút</span>
              </div>
            )}
            {!battery.charging && battery.dischargingTime !== Infinity && (
              <div className="hw-row">
                <span className="hw-lbl">Còn dùng được</span>
                <span className="hw-val">{Math.round(battery.dischargingTime/3600*10)/10} giờ</span>
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── Network ── */}
      <div className="hw-section">
        <div className="hw-sec-hdr">
          <span className="hw-icon">📶</span> Mạng
          <span className={`hw-st ${network.online ? 'on' : 'off'}`}>{network.online ? 'Online' : 'Offline'}</span>
        </div>
        <div className="hw-sec-body">
          <div className="hw-row">
            <span className="hw-lbl">Loại kết nối</span>
            <span className="hw-val">{network.type || '?'}</span>
          </div>
          {network.downlink != null && (
            <div className="hw-row">
              <span className="hw-lbl">Tốc độ ước tính</span>
              <span className="hw-val">{network.downlink} Mbps</span>
            </div>
          )}
          {network.rtt != null && (
            <div className="hw-row">
              <span className="hw-lbl">Độ trễ (RTT)</span>
              <span className="hw-val">{network.rtt} ms</span>
            </div>
          )}
          {network.saveData && (
            <div style={{fontSize:11,color:'#f57f17'}}>⚡ Chế độ tiết kiệm dữ liệu đang bật</div>
          )}
        </div>
      </div>

      {/* ── Screen Wake Lock ── */}
      <div className="hw-section">
        <div className="hw-sec-hdr">
          <span className="hw-icon">💡</span> Giữ sáng màn hình
          <span className={`hw-st ${wakeSupported ? (wakeActive?'on':'off') : 'na'}`}>
            {wakeSupported ? (wakeActive ? 'Đang bật' : 'Tắt') : 'Không hỗ trợ'}
          </span>
        </div>
        <div className="hw-sec-body">
          <div style={{fontSize:11.5,color:'#5f6368'}}>Ngăn màn hình tắt khi đang đọc tài liệu.</div>
          <button
            className={`hw-btn ${wakeActive ? 'danger' : 'primary'}`}
            disabled={!wakeSupported}
            onClick={toggleWakeLock}>
            {wakeActive ? '🌙 Tắt giữ sáng' : '💡 Bật giữ sáng'}
          </button>
        </div>
      </div>

      {/* ── Geolocation ── */}
      <div className="hw-section">
        <div className="hw-sec-hdr">
          <span className="hw-icon">📍</span> Vị trí GPS
          <span className={`hw-st ${geo && geo !== 'denied' && geo !== 'error' && geo !== 'unsupported' && geo !== 'loading' ? 'on' : geo === 'denied' ? 'off' : 'na'}`}>
            {geo === null ? 'Chưa yêu cầu' : geo === 'loading' ? 'Đang lấy...' : geo === 'denied' ? 'Bị từ chối' : geo === 'error' ? 'Lỗi' : geo === 'unsupported' ? 'N/A' : 'Đã lấy'}
          </span>
        </div>
        <div className="hw-sec-body">
          {geo && typeof geo === 'object' ? (
            <>
              <div className="hw-row"><span className="hw-lbl">Latitude</span><span className="hw-val">{geo.lat}</span></div>
              <div className="hw-row"><span className="hw-lbl">Longitude</span><span className="hw-val">{geo.lng}</span></div>
              <div className="hw-row"><span className="hw-lbl">Độ chính xác</span><span className="hw-val">±{geo.accuracy}m</span></div>
              <div className="hw-row">
                <button className="hw-btn sec" style={{fontSize:10.5}} onClick={()=>onSendToChat(`📍 Vị trí: ${geo.lat}, ${geo.lng} (±${geo.accuracy}m) — https://maps.google.com?q=${geo.lat},${geo.lng}`)}>→ Gửi vào chat</button>
                <a className="hw-btn sec" style={{fontSize:10.5,textDecoration:'none'}} href={`https://maps.google.com?q=${geo.lat},${geo.lng}`} target="_blank" rel="noreferrer">🗺 Google Maps</a>
              </div>
            </>
          ) : (
            <button className="hw-btn primary" disabled={!geoSupported} onClick={requestGeo}>
              📍 Lấy vị trí hiện tại
            </button>
          )}
          {(geo === 'denied' || geo === 'error') && <div style={{fontSize:11,color:'#c62828'}}>⚠️ {geo === 'denied' ? 'Quyền vị trí bị từ chối.' : 'Không lấy được vị trí.'}</div>}
        </div>
      </div>

      {/* ── Vibration ── */}
      <div className="hw-section">
        <div className="hw-sec-hdr">
          <span className="hw-icon">📳</span> Rung (Haptic)
          <span className={`hw-st ${vibSupported ? 'on' : 'na'}`}>{vibSupported ? 'Hỗ trợ' : 'N/A'}</span>
        </div>
        <div className="hw-sec-body">
          <div className="hw-row" style={{flexWrap:'wrap',gap:6}}>
            <button className="hw-btn sec" disabled={!vibSupported} onClick={()=>vibrate([100])}>💬 Ngắn</button>
            <button className="hw-btn sec" disabled={!vibSupported} onClick={()=>vibrate([200,100,200])}>📳 Kép</button>
            <button className="hw-btn sec" disabled={!vibSupported} onClick={()=>vibrate([100,50,100,50,300])}>🎶 Nhịp</button>
            <button className="hw-btn danger" disabled={!vibSupported} onClick={()=>vibrate([0])}>⏹ Dừng</button>
          </div>
        </div>
      </div>

      {/* ── Device Info ── */}
      <div className="hw-section">
        <div className="hw-sec-hdr">
          <span className="hw-icon">💻</span> Thông tin thiết bị
          <span className="hw-st on">Sẵn sàng</span>
        </div>
        <div className="hw-sec-body">
          {hwInfo.memory    && <div className="hw-row"><span className="hw-lbl">RAM</span><span className="hw-val">{hwInfo.memory}</span></div>}
          {hwInfo.cpuCores  && <div className="hw-row"><span className="hw-lbl">CPU cores</span><span className="hw-val">{hwInfo.cpuCores} lõi</span></div>}
          <div className="hw-row"><span className="hw-lbl">Màn hình</span><span className="hw-val">{hwInfo.screenW}×{hwInfo.screenH} @{hwInfo.pixelRatio}x</span></div>
          <div className="hw-row"><span className="hw-lbl">Cảm ứng</span><span className="hw-val">{hwInfo.touchPoints > 0 ? `✅ ${hwInfo.touchPoints} điểm` : '❌ Không'}</span></div>
          <div className="hw-row"><span className="hw-lbl">Xoay màn hình</span><span className="hw-val">{orient}</span></div>
          {hwInfo.platform  && <div className="hw-row"><span className="hw-lbl">Platform</span><span className="hw-val">{hwInfo.platform}</span></div>}
          <button className="hw-btn sec" style={{marginTop:4,fontSize:10.5}}
            onClick={()=>onSendToChat(`💻 Thiết bị: ${hwInfo.screenW}×${hwInfo.screenH} @${hwInfo.pixelRatio}x · ${hwInfo.cpuCores||'?'} lõi · RAM ${hwInfo.memory||'?'} · Cảm ứng ${hwInfo.touchPoints} · ${orient}`)}>
            → Gửi vào chat
          </button>
        </div>
      </div>

    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [open,       setOpen]       = useState(false);
  const [msgs,       setMsgs]       = useState([]);
  const [input,      setInput]      = useState('');
  const [busy,       setBusy]       = useState(false);
  const [selFile,    setSelFile]    = useState(null);
  const [status,     setStatus]     = useState({ fileCount:0, ready:false });
  const [toast,      setToast]      = useState('');
  const [activeExt,  setActiveExt]  = useState('');
  const [unread,     setUnread]     = useState(0);
  const [activeTab,  setActiveTab]  = useState('chat');   // 'chat' | 'translate' | 'browse'
  const [trInit,     setTrInit]     = useState({ text:'', src:'vi', tgt:'en' });
  const [voiceLang,  setVoiceLang]  = useState('vi');
  const [darkMode,   setDarkMode]   = useState(()=> localStorage.getItem('darkMode')==='1');
  const [showAdv,    setShowAdv]    = useState(false);    // advanced search panel
  const [advFilters, setAdvFilters] = useState({ dateFrom:'', dateTo:'', sizeMin:'', sizeMax:'', dir:'' });
  const [browseDir,  setBrowseDir]  = useState(null);     // current browse path
  const [browseTree, setBrowseTree] = useState(null);
  const [showAIModal,setShowAIModal]= useState(false);    // AI settings modal
  const [showVoiceBar,setShowVoiceBar]= useState(false);  // voice lang row toggle

  const bottomRef   = useRef(null);
  const inputRef    = useRef(null);
  const toastT      = useRef(null);
  const sendMsgRef  = useRef(null); // stable ref for voice auto-send

  // ── AI hook ──
  const { cfg: aiCfg, setCfg: setAiCfg, callAI, resetHistory: resetAIHistory } = useAI();

  // ── voice input (chat) ──
  const voice = useVoiceInput(LANG_SPEECH[voiceLang] || 'vi-VN');

  // ── dark mode persistence ──
  useEffect(()=>{
    localStorage.setItem('darkMode', darkMode ? '1' : '0');
    document.documentElement.setAttribute('data-dark', darkMode ? '1' : '');
  }, [darkMode]);

  // ── helpers ──
  const showToast = useCallback(msg => {
    setToast(msg);
    clearTimeout(toastT.current);
    toastT.current = setTimeout(()=>setToast(''), 3000);
  }, []);

  const push = useCallback(msg => {
    const m = { ...msg, time: FMT_TIME() };
    setMsgs(p => {
      const next = [...p, m];
      // persist last 40 msgs
      try { localStorage.setItem('chatHistory', JSON.stringify(next.slice(-40))); } catch {}
      return next;
    });
    if (!open) setUnread(u => u+1);
  }, [open]);

  const replaceLast = useCallback(msg => {
    setMsgs(p => {
      const c = [...p];
      c[c.length-1] = { ...msg, time: FMT_TIME() };
      try { localStorage.setItem('chatHistory', JSON.stringify(c.slice(-40))); } catch {}
      return c;
    });
  }, []);

  // ── sync voice transcript → chat input ──
  useEffect(() => {
    if (voice.transcript) setInput(voice.transcript.trim());
  }, [voice.transcript]);

  // ── auto-send on voice stop — use ref to avoid stale closure ──
  useEffect(() => {
    if (!voice.listening && voice.transcript.trim()) {
      const txt = voice.transcript.trim();
      const t = setTimeout(() => {
        if (sendMsgRef.current) {
          sendMsgRef.current(txt);
          voice.reset();
          setInput('');
        }
      }, 700);
      return () => clearTimeout(t);
    }
  }, [voice.listening]); // eslint-disable-line

  // ── browse directory ──
  const browseDir2 = useCallback(async (dirPath) => {
    try {
      const r = await fetch(`/api/tree?path=${encodeURIComponent(dirPath||'')}`);
      const d = await r.json();
      setBrowseTree(d);
      setBrowseDir(d.path);
    } catch {}
  }, []);

  // ── scroll ──
  useEffect(()=>{
    bottomRef.current?.scrollIntoView({ behavior:'smooth' });
  }, [msgs]);

  useEffect(()=>{
    if (open) {
      setUnread(0);
      setTimeout(()=>inputRef.current?.focus(), 120);
    }
  }, [open]);

  // ── poll status + restore history ──
  useEffect(()=>{
    const poll = async () => {
      try {
        const r = await fetch('/api/status');
        const d = await r.json();
        setStatus(d);
        return d;
      } catch { return null; }
    };

    const init = async () => {
      const d = await poll();
      // Try restore chat history (text-only msgs, skip actions/results which have stale callbacks)
      let restored = [];
      try {
        const raw = localStorage.getItem('chatHistory');
        if (raw) {
          const arr = JSON.parse(raw);
          restored = arr.filter(m => ['user','bot','welcome','preview'].includes(m.type));
        }
      } catch {}

      if (restored.length > 0) {
        setMsgs(restored);
      } else if (d) {
        const cnt = (d.fileCount||0).toLocaleString();
        setMsgs([{
          type:'welcome',
          time: FMT_TIME(),
          suggestions:[
            '🔍 Tìm file xã Thanh Phú',
            '📄 Tìm hợp đồng nguyên tắc',
            '📊 Tìm danh sách khách hàng',
            '🖼️ Tìm hình ảnh trạm bơm',
          ],
          fileCount: cnt,
        }]);
      }
    };
    init();
    const iv = setInterval(poll, 8000);
    return ()=>clearInterval(iv);
  }, []);

  // ── translate to chat ──
  const translateToChat = useCallback((msg) => {
    push({ type:'bot', text: msg });
    setActiveTab('chat');
  }, [push]);

  // ── file action handler ──
  const handleAction = useCallback(async (action, f) => {
    switch(action) {

      case 'translate': {
        // Switch to translate tab pre-filled with filename
        setTrInit({ text: f.nameNoExt || f.name, src:'vi', tgt:'en' });
        setActiveTab('translate');
        push({ type:'bot', text:`🌐 Đã mở tab **Dịch** với tên file: **${f.name}**\nChọn ngôn ngữ và nhấn **Dịch**!` });
        break;
      }

      case 'read': {
        push({ type:'bot', text:`⏳ Đang đọc **${f.name}**...` });
        try {
          const r = await fetch(`/api/read?path=${encodeURIComponent(f.path)}`);
          const d = await r.json();
          if (d.error) { replaceLast({type:'bot', text:`❌ ${d.error}`}); break; }
          replaceLast({
            type:'preview',
            filename: f.name,
            previewType: d.type,
            data:    d.data,
            content: d.content || d.message,
            message: d.message,
          });
        } catch(e) {
          replaceLast({type:'bot', text:`❌ Lỗi: ${e.message}`});
        }
        break;
      }

      case 'open':
      case 'edit': {
        try {
          const r = await fetch('/api/open',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ filePath: f.path })
          });
          const d = await r.json();
          if (d.success)
            push({type:'bot', text:`✅ Đã mở **${f.name}** bằng ứng dụng mặc định.`});
          else
            push({type:'bot', text:`❌ Không mở được: ${d.error}`});
        } catch(e) {
          push({type:'bot', text:`❌ ${e.message}`});
        }
        break;
      }

      case 'word2pdf': {
        push({type:'bot', text:`🔄 Đang chuyển **${f.name}** → PDF...`});
        try {
          const r = await fetch('/api/convert/word2pdf',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ filePath: f.path })
          });
          const d = await r.json();
          if (d.success)
            replaceLast({type:'bot',
              text:`✅ Chuyển đổi thành công!\n\n📄 Tệp PDF đã lưu tại:\n**${d.outPath}**`,
              suggestions:['🚀 Mở file PDF vừa tạo'],
              onSuggest: ()=>handleAction('open',{...f,path:d.outPath,name:d.outPath.split('\\').pop()})
            });
          else
            replaceLast({type:'bot', text:`❌ ${d.error}`});
        } catch(e) {
          replaceLast({type:'bot', text:`❌ ${e.message}`});
        }
        break;
      }

      case 'pdf2word': {
        push({type:'bot', text:`🔄 Đang chuyển **${f.name}** → Word...`});
        try {
          const r = await fetch('/api/convert/pdf2word',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ filePath: f.path })
          });
          const d = await r.json();
          if (d.success)
            replaceLast({type:'bot',
              text:`✅ Chuyển đổi thành công!\n\n📝 File Word đã lưu tại:\n**${d.outPath}**`,
              suggestions:['🚀 Mở file Word vừa tạo'],
              onSuggest: ()=>handleAction('open',{...f,path:d.outPath,name:d.outPath.split('\\').pop()})
            });
          else if (d.needInstall)
            replaceLast({type:'bot',
              text:`⚠️ ${d.error}\n\nHoặc dùng công cụ online:\n🌐 https://pdf2doc.com`});
          else
            replaceLast({type:'bot', text:`❌ ${d.error}`});
        } catch(e) {
          replaceLast({type:'bot', text:`❌ ${e.message}`});
        }
        break;
      }

      case 'copypath': {
        try {
          // Try clipboard API first, fallback to server-side clip.exe
          await navigator.clipboard.writeText(f.path);
          showToast('✅ Đã sao chép đường dẫn vào clipboard!');
        } catch {
          await fetch('/api/copypath',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ filePath: f.path })
          });
          showToast('✅ Đã sao chép vào clipboard!');
        }
        break;
      }

      case 'folder': {
        try {
          await fetch('/api/open',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ filePath: f.path, openFolder: true })
          });
          push({type:'bot', text:`📂 Đã mở thư mục chứa **${f.name}**.`});
        } catch(e) {
          push({type:'bot', text:`❌ ${e.message}`});
        }
        break;
      }

      case 'info': {
        push({type:'bot',
          text:`ℹ️ **Thông tin tệp**\n\n📄 **Tên:** ${f.name}\n📁 **Thư mục:** ${f.dir}\n🗂 **Định dạng:** ${(f.ext||'').toUpperCase().replace('.','')}\n💾 **Dung lượng:** ${f.size}\n📅 **Ngày sửa:** ${f.modified}\n\n📍 **Đường dẫn:**\n${f.path}`
        });
        break;
      }
    }
  }, [push, replaceLast, showToast]);

  // ── file select → show action bar ──
  const onFileSelect = useCallback(file => {
    setSelFile(file);
    push({
      type:     'actions',
      file,
      onAction: handleAction,
    });
  }, [push, handleAction]);

  // ── send message ──
  const sendMsg = useCallback(async (override) => {
    const text = (override || input).trim();
    if (!text || busy) return;
    setInput('');
    setBusy(true);

    push({ type:'user', text });

    await new Promise(r => setTimeout(r,150));

    const lower = text.toLowerCase();

    // ── Search flow ──
    if (isSearch(text)) {
      const q = extractQ(text);
      push({ type:'scanning', total: status.fileCount||0 });

      try {
        // Build URL with advanced filters
        let url = `/api/search?q=${encodeURIComponent(q)}&limit=20${activeExt?'&ext='+encodeURIComponent(activeExt):''}`;
        if (advFilters.dateFrom) url += `&dateFrom=${advFilters.dateFrom}`;
        if (advFilters.dateTo)   url += `&dateTo=${advFilters.dateTo}`;
        if (advFilters.sizeMin)  url += `&sizeMin=${advFilters.sizeMin}`;
        if (advFilters.sizeMax)  url += `&sizeMax=${advFilters.sizeMax}`;
        if (advFilters.dir)      url += `&dir=${encodeURIComponent(advFilters.dir)}`;
        const r   = await fetch(url);
        const d   = await r.json();

        setStatus(s=>({...s, fileCount: d.indexSize||s.fileCount}));

        const n = d.results?.length||0;
        replaceLast({
          type:    'results',
          text:    n>0
            ? `Đã quét <strong>${(d.indexSize||0).toLocaleString()}</strong> tệp — tìm thấy <strong>${n}</strong> kết quả cho "<em>${q}</em>":`
            : null,
          results: d.results||[],
        });

        if (n===0) {
          push({
            type:'bot',
            text:`Không tìm thấy tệp nào khớp với "<strong>${q}</strong>".\n\nGợi ý:\n• Thử từ khóa ngắn hơn\n• Bỏ bộ lọc loại file\n• Kiểm tra lại tên`,
            suggestions:['🔄 Làm mới chỉ mục','📊 Xem thống kê','Tôi làm được gì?'],
          });
        }
      } catch(e) {
        replaceLast({type:'bot', text:`❌ Lỗi tìm kiếm: ${e.message}\nKiểm tra server đang chạy.`});
      }

      setBusy(false);
      return;
    }

    // ── Translate command in chat ──
    const trCmd = parseTranslateCmd(text);
    if (trCmd || /^(?:dịch|translate)\b/i.test(lower)) {
      if (trCmd) {
        push({ type:'bot', text:`⏳ Đang dịch sang **${trCmd.tgt.toUpperCase()}**...` });
        try {
          const out = await doTranslate(trCmd.text, 'auto', trCmd.tgt);
          replaceLast({ type:'bot',
            text:`🌐 **Kết quả dịch:**\n\n📝 Gốc: ${trCmd.text}\n✅ Dịch (${trCmd.tgt.toUpperCase()}): **${out}**`,
            suggestions:[
              '🌐 Mở công cụ dịch đầy đủ',
            ],
          });
        } catch(e) {
          replaceLast({ type:'bot', text:`❌ Lỗi dịch: ${e.message}` });
        }
      } else {
        // just "dịch" without text → open translate tab
        setActiveTab('translate');
        push({ type:'bot',
          text:`🌐 Đã mở **Tab Dịch**!\n\nNhập văn bản và chọn ngôn ngữ để dịch.\n\nHoặc gõ nhanh: **"dịch [văn bản] sang [ngôn ngữ]"**`,
          suggestions:['dịch hello world sang tiếng việt','dịch xin chào sang tiếng anh'],
        });
      }
      setBusy(false);
      return;
    }

    // open translate tab suggestion
    if (/mở.*dịch|công.*cụ.*dịch|tab.*dịch/i.test(lower)) {
      setActiveTab('translate');
      push({ type:'bot', text:`🌐 Đã mở **Tab Dịch**!` });
      setBusy(false);
      return;
    }

    // ── Try AI first if configured ────────────────────────────────────────────
    if (aiCfg.enabled && aiCfg.apiKey) {
      push({ type:'typing' });
      try {
        const aiReply = await callAI(text);
        if (aiReply) {
          // Check if AI returned a search action JSON
          const actionMatch = aiReply.match(/\{[^}]*"action"\s*:\s*"search"[^}]*\}/);
          if (actionMatch) {
            try {
              const act = JSON.parse(actionMatch[0]);
              if (act.action === 'search' && act.query) {
                // Execute search on behalf of AI
                let url = `/api/search?q=${encodeURIComponent(act.query)}&limit=20`;
                if (act.ext) url += `&ext=${encodeURIComponent(act.ext)}`;
                if (activeExt) url += `&ext=${encodeURIComponent(activeExt)}`;
                const r2 = await fetch(url);
                const d2 = await r2.json();
                const n2 = d2.results?.length||0;
                // Replace typing bubble with AI message + results
                replaceLast({
                  type:'bot',
                  text: `🤖 AI tìm theo: **"${act.query}"** ${act.ext?`(${act.ext})`:''}`,
                });
                push({
                  type:    'results',
                  text:    n2>0 ? `Tìm thấy <strong>${n2}</strong> kết quả:` : null,
                  results: d2.results||[],
                });
                if (n2===0) push({type:'bot', text:`Không tìm thấy kết quả nào cho **"${act.query}"**.`, suggestions:['Thử từ khóa khác','Bỏ bộ lọc']});
                setBusy(false);
                return;
              }
            } catch {}
          }
          // Normal AI text reply
          replaceLast({ type:'bot', text: aiReply });
          setBusy(false);
          return;
        }
      } catch(e) {
        replaceLast({ type:'bot', text:`⚠️ AI lỗi: ${e.message}\nĐang dùng chế độ thường...` });
        // fall through to keyword handling below
      }
    }

    // ── Conversation (fallback — no AI or AI failed) ───────────────────────────
    let reply='', suggs=null;

    if (/xin\s*chào|hello|hi\b/i.test(lower)) {
      reply = `Chào bạn! 😊 Tôi đang quản lý **${(status.fileCount||0).toLocaleString()} tệp**.\nHãy nhập tên file cần tìm!`;
      suggs = ['Tìm hợp đồng','Tìm file PDF','Tìm hình ảnh'];

    } else if (/cảm\s*ơn|thanks/i.test(lower)) {
      reply = `Không có gì! 😊 Cần tìm thêm gì cứ hỏi tôi nhé!`;

    } else if (/bao\s*nhiêu|số\s*lượng|tổng\s*số/i.test(lower)) {
      try {
        const r = await fetch('/api/stats');
        const d = await r.json();
        reply = `📊 **Thống kê kho tệp:**\n\n📁 Tổng: **${d.total?.toLocaleString()} tệp**\n💾 Dung lượng: **${d.totalSize}**\n📅 Cập nhật: ${d.lastIndexed?.slice(0,10)||'—'}\n\n**Top loại file:**\n${d.topExts?.map(e=>`${e.icon} ${e.ext} — ${e.count}`).join('\n')||'—'}`;
      } catch {
        reply = `📊 Hiện có **${(status.fileCount||0).toLocaleString()} tệp** trong kho.`;
      }

    } else if (/thống\s*kê|stat/i.test(lower)) {
      try {
        const r = await fetch('/api/stats');
        const d = await r.json();
        reply = `📊 **${d.total?.toLocaleString()} tệp** — **${d.totalSize}**\n\n${d.topExts?.map(e=>`${e.icon} **${e.ext||'(không rõ)'}**: ${e.count} tệp`).join('\n')}`;
      } catch { reply = 'Không lấy được thống kê.'; }

    } else if (/làm\s*được\s*gì|chức\s*năng|giúp\s*(gì|tôi)|hướng\s*dẫn/i.test(lower)) {
      reply = `Tôi có thể:\n\n🔍 **Tìm kiếm fuzzy** — không cần gõ đúng tên, tìm cả tiếng Việt không dấu\n👁 **Đọc nội dung** — Word (.docx), Excel, ảnh, text\n✏️ **Mở & chỉnh sửa** — mở bằng ứng dụng mặc định\n🔄 **Chuyển đổi** — Word→PDF, PDF→Word\n🌐 **Dịch ngôn ngữ** — VI↔EN↔ZH↔JA↔KO và nhiều ngôn ngữ khác\n📋 **Sao chép đường dẫn** — copy path vào clipboard\n📂 **Mở thư mục** — xem vị trí file trong Explorer`;
      suggs = ['Tìm file xã Thanh Phú','🌐 Mở công cụ dịch','📊 Xem thống kê'];

    } else if (/làm\s*mới|refresh|cập\s*nhật\s*chỉ\s*mục/i.test(lower)) {
      try {
        const r = await fetch('/api/refresh',{method:'POST'});
        const d = await r.json();
        reply = `🔄 ${d.message}`;
      } catch { reply = '❌ Không thể kết nối server.'; }

    } else {
      // fallback: auto-search
      push({ type:'scanning', total: status.fileCount||0 });
      try {
        const r = await fetch(`/api/search?q=${encodeURIComponent(text)}&limit=15${activeExt?'&ext='+encodeURIComponent(activeExt):''}`);
        const d = await r.json();
        const n = d.results?.length||0;
        replaceLast({
          type:    'results',
          text:    n>0 ? `Kết quả cho "<em>${text}</em>":` : null,
          results: d.results||[],
        });
        if (n===0) {
          push({type:'bot',
            text:`Không tìm thấy kết quả. Thử:\n• "Tìm tệp xã thanh phú"\n• "Kiếm hợp đồng 2023"\n• Hỏi tôi: "làm được gì?"`,
            suggestions:['Tìm file PDF','Tìm hợp đồng','Làm được gì?']
          });
        }
      } catch {
        push({type:'bot', text:'Xin lỗi, không thể kết nối server. Hãy kiểm tra server đang chạy.'});
      }
      setBusy(false);
      return;
    }

    push({ type:'bot', text:reply, suggestions:suggs });
    setBusy(false);
  }, [input, busy, push, replaceLast, status, activeExt, advFilters, handleAction, aiCfg, callAI]);

  // ── keep sendMsgRef current so voice auto-send never gets stale closure ──
  useEffect(() => { sendMsgRef.current = sendMsg; });

  const onKey = e => {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  };

  // ── refresh badge ──
  const doRefresh = async () => {
    try {
      const r = await fetch('/api/refresh',{method:'POST'});
      const d = await r.json();
      showToast('🔄 ' + d.message);
    } catch { showToast('❌ Không thể kết nối server'); }
  };

  return (<>
    {/* Launcher */}
    <button id="fab" onClick={()=>setOpen(o=>!o)} title="Trợ lý tìm file">
      <span>{open?'✕':'📂'}</span>
      <span className={`badge${unread>0?' show':''}`}>{unread>9?'9+':unread}</span>
    </button>

    {/* AI Settings Modal */}
    {showAIModal && (
      <AISettingsModal
        aiCfg={aiCfg}
        onSave={cfg => { setAiCfg(cfg); resetAIHistory(); }}
        onClose={()=>setShowAIModal(false)}/>
    )}

    {/* Chat window */}
    <div className={`cw ${open?'on':'off'}`}>

      {/* Header */}
      <div className="ch">
        <div className="ch-av">📂</div>
        <div className="ch-info">
          <h3>Trợ Lý Tìm File</h3>
          <p>
            <span className={`sdot${busy?' busy':''}`}/>
            {busy ? 'Đang xử lý...' :
              status.fileCount>0
                ? `${status.fileCount.toLocaleString()} tệp • Sẵn sàng`
                : 'Đang khởi tạo...'}
          </p>
        </div>
        <div className="ch-actions">
          {/* AI badge — click to open settings */}
          <button
            className={`ai-badge ${aiCfg.enabled?'on':'off'}`}
            onClick={()=>setShowAIModal(true)}
            title={aiCfg.enabled
              ? `AI: ${AI_PROVIDERS.find(p=>p.id===aiCfg.provider)?.name||aiCfg.provider} — bấm để đổi`
              : 'Bấm để cài AI'}>
            {aiCfg.enabled
              ? `${AI_PROVIDERS.find(p=>p.id===aiCfg.provider)?.icon||'🤖'} AI`
              : '🤖'}
          </button>
          {/* Device badge */}
          {DEVICE.isTouch && (
            <span style={{fontSize:10,background:'rgba(255,255,255,.2)',borderRadius:10,padding:'2px 7px',color:'#fff',flexShrink:0,whiteSpace:'nowrap'}}>
              📱
            </span>
          )}
          {!DEVICE.isLocal && !DEVICE.isTouch && (
            <span style={{fontSize:10,background:'rgba(255,255,255,.2)',borderRadius:10,padding:'2px 7px',color:'#fff',flexShrink:0,whiteSpace:'nowrap'}}>
              🌐 LAN
            </span>
          )}
          <button className="ch-btn" title={darkMode?'Sáng':'Tối'} onClick={()=>setDarkMode(d=>!d)}>{darkMode?'☀️':'🌙'}</button>
          <button className="ch-btn" title="Duyệt thư mục" onClick={()=>{ setActiveTab('browse'); browseDir2(''); }}>📁</button>
          <button className="ch-btn" title="Công cụ dịch" onClick={()=>setActiveTab(t=>t==='translate'?'chat':'translate')}>🌐</button>
          <button className="ch-btn" title="Làm mới chỉ mục" onClick={doRefresh}>🔄</button>
          <button className="ch-btn" title="Đóng" onClick={()=>setOpen(false)}>✕</button>
        </div>
      </div>

      {/* Tab bar */}
      <div className="tabbar">
        <button className={`tab${activeTab==='chat'?' active':''}`} onClick={()=>setActiveTab('chat')}>
          <span className="ti">💬</span>Chat
        </button>
        <button className={`tab${activeTab==='translate'?' active':''}`} onClick={()=>setActiveTab('translate')}>
          <span className="ti">🌐</span>Dịch
        </button>
        <button className={`tab${activeTab==='browse'?' active':''}`} onClick={()=>{ setActiveTab('browse'); if(!browseTree) browseDir2(''); }}>
          <span className="ti">📁</span>Duyệt
        </button>
        <button className={`tab${activeTab==='hardware'?' active':''}`} onClick={()=>setActiveTab('hardware')}>
          <span className="ti">📱</span>HW
        </button>
      </div>

      {/* Chat tab */}
      {activeTab==='chat' && (<>
        {/* HTTP warning banner — only on non-secure LAN context */}
        {!IS_SECURE && (
          <div style={{
            padding:'6px 12px',background:'#fff8e1',borderBottom:'1px solid #ffe082',
            fontSize:11,color:'#5d4037',display:'flex',alignItems:'flex-start',gap:7,flexShrink:0,
          }}>
            <span style={{flexShrink:0}}>⚠️</span>
            <span style={{lineHeight:1.5}}>
              Trang đang chạy qua <strong>HTTP</strong> → micro & camera bị chặn bởi trình duyệt.<br/>
              Để dùng voice: mở Chrome → <code style={{fontSize:10,background:'#efebe9',borderRadius:3,padding:'0 3px'}}>chrome://flags/#unsafely-treat-insecure-origin-as-secure</code> → thêm địa chỉ này → Relaunch.<br/>
              Hoặc truy cập qua <strong>localhost</strong> trên máy chủ.
            </span>
          </div>
        )}
        {/* Filter bar */}
        <div className="fbar">
          {FILTERS.map(f=>(
            <button key={f.val}
              className={`ftag${activeExt===f.val?' active':''}`}
              onClick={()=>setActiveExt(f.val)}>
              {f.icon} {f.label}
            </button>
          ))}
          <button
            className={`ftag${showAdv?' active':''}`}
            onClick={()=>setShowAdv(s=>!s)}
            title="Bộ lọc nâng cao">
            ⚙️ Lọc
          </button>
        </div>

        {/* Advanced search panel */}
        {showAdv && (
          <div className="advpanel">
            <div className="advpanel-title">⚙️ BỘ LỌC NÂNG CAO</div>
            <div className="advrow">
              <span className="adv-lbl">📅 Từ</span>
              <input type="date" className="advinput" value={advFilters.dateFrom}
                onChange={e=>setAdvFilters(f=>({...f,dateFrom:e.target.value}))}/>
              <span className="adv-lbl">đến</span>
              <input type="date" className="advinput" value={advFilters.dateTo}
                onChange={e=>setAdvFilters(f=>({...f,dateTo:e.target.value}))}/>
            </div>
            <div className="advrow">
              <span className="adv-lbl">💾 Size</span>
              <input type="number" className="advinput" placeholder="Min KB" value={advFilters.sizeMin}
                onChange={e=>setAdvFilters(f=>({...f,sizeMin:e.target.value}))}/>
              <span className="adv-lbl">–</span>
              <input type="number" className="advinput" placeholder="Max KB" value={advFilters.sizeMax}
                onChange={e=>setAdvFilters(f=>({...f,sizeMax:e.target.value}))}/>
            </div>
            <div className="advrow">
              <span className="adv-lbl">📂 Thư mục</span>
              <input type="text" className="advinput" placeholder="VD: Dir_001" value={advFilters.dir}
                onChange={e=>setAdvFilters(f=>({...f,dir:e.target.value}))}/>
              <button className="advclear"
                onClick={()=>setAdvFilters({dateFrom:'',dateTo:'',sizeMin:'',sizeMax:'',dir:''})}>
                ✕ Xoá
              </button>
            </div>
          </div>
        )}

        {/* Messages */}
        <div className="msgs">
          {msgs.map((m,i)=>(
            <Msg key={i} msg={m}
              onFileSelect={onFileSelect}
              selFile={selFile}
              onSuggest={sendMsg}
              serverIsLocal={status.isLocal}/>
          ))}
          <div ref={bottomRef}/>
        </div>

        {/* Voice status bar */}
        {voice.supported && voice.listening && (
          <div className="voice-bar">
            <div className="vdots"><span/><span/><span/></div>
            <span>Đang nghe{voice.interimText ? `: "${voice.interimText}"` : '...'}</span>
            <button style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'#c62828',fontWeight:700,fontSize:12}}
              onClick={voice.stop}>■ Dừng</button>
          </div>
        )}
        {voice.error && (
          <div className="voice-bar" style={{
            background: voice.permState==='denied' ? '#fff3e0' : '#fff8e1',
            borderColor: voice.permState==='denied' ? '#ffcc80' : '#ffe0b2',
            color:'#e65100', flexDirection:'column', alignItems:'flex-start', gap:4,
            whiteSpace:'pre-wrap', lineHeight:1.5,
          }}>
            <div style={{display:'flex',alignItems:'center',gap:6,width:'100%'}}>
              <span>{voice.permState==='denied' ? '🚫' : '⚠️'}</span>
              <strong style={{flex:1,fontSize:11.5}}>
                {voice.permState==='denied' ? 'Microphone bị chặn' : 'Lỗi microphone'}
              </strong>
              <button style={{background:'none',border:'none',cursor:'pointer',color:'#9aa0a6',fontSize:13,padding:'0 2px'}}
                onClick={voice.reset} title="Đóng">✕</button>
            </div>
            <div style={{fontSize:11,lineHeight:1.6,paddingLeft:20}}>{voice.error}</div>
            {voice.permState==='denied' && IS_SECURE && (
              <div style={{fontSize:10.5,paddingLeft:20,color:'#bf360c'}}>
                👆 Nhấn 🔒 trên thanh địa chỉ → Microphone → <strong>Cho phép</strong> → F5
              </div>
            )}
          </div>
        )}

        {/* Input */}
        <div className="ia">
          <textarea ref={inputRef} className="cinput" rows={1}
            placeholder={voice.listening ? '🎤 Đang nghe giọng nói...' : 'Tìm file hoặc "dịch hello sang tiếng việt"…'}
            value={voice.listening
              ? (voice.transcript + (voice.interimText ? ' ' + voice.interimText : ''))
              : input}
            onChange={e=>{ if (!voice.listening) setInput(e.target.value); }}
            onKeyDown={onKey}
            disabled={busy}
            style={voice.listening ? {borderColor:'#e53935',background:'#fff8f8'} : {}}/>
          {voice.supported && (
            <button
              className={`bmic${voice.listening?' listening':''}`}
              onClick={()=>{
                if (voice.listening) { voice.stop(); }
                else { voice.reset(); setInput(''); voice.toggle(); }
              }}
              disabled={busy}
              title={voice.listening ? 'Dừng ghi âm (gửi tự động)' : `Nhập bằng giọng nói (${LANG_SPEECH[voiceLang]||'vi-VN'})`}>
              {voice.listening ? '⏹' : '🎤'}
            </button>
          )}
          <button className="bsend"
            onClick={()=>{ if(voice.listening){ voice.stop(); } else { sendMsg(); } }}
            disabled={(!input.trim() && !voice.transcript.trim() && !voice.listening) || busy}
            title="Gửi (Enter)">
            ➤
          </button>
        </div>

        {/* Voice lang + clear — collapsed by default, toggle with small button */}
        <div style={{padding:'3px 10px 4px',borderTop:'1px solid #f5f5f5',display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
          <button
            style={{fontSize:10,color:'#9aa0a6',background:'none',border:'none',cursor:'pointer',padding:'1px 4px',borderRadius:5,display:'flex',alignItems:'center',gap:3}}
            onClick={()=>setShowVoiceBar(v=>!v)}
            title="Tuỳ chọn giọng nói & lịch sử">
            🎤 {showVoiceBar?'▲':'▼'}
          </button>
          {!voice.supported && (
            <span style={{fontSize:10,color:'#bdc1c6'}}>Chrome/Edge để dùng voice</span>
          )}
          {/* Always-visible clear button */}
          <button style={{
            marginLeft:'auto',fontSize:10,color:'#c0c6cc',background:'none',border:'none',
            cursor:'pointer',padding:'1px 5px',borderRadius:5,
          }}
            onClick={()=>{
              try{localStorage.removeItem('chatHistory');}catch{}
              setMsgs([{type:'welcome',time:FMT_TIME(),
                suggestions:['🔍 Tìm file xã Thanh Phú','📄 Tìm hợp đồng','📊 Thống kê']}]);
            }}
            title="Xoá lịch sử chat">
            🗑
          </button>
        </div>
        {/* Expanded: voice lang selector */}
        {showVoiceBar && voice.supported && (
          <div style={{padding:'3px 10px 6px',display:'flex',alignItems:'center',gap:4,flexShrink:0,flexWrap:'wrap'}}>
            {[{c:'vi',f:'🇻🇳',n:'VI'},{c:'en',f:'🇬🇧',n:'EN'},{c:'zh',f:'🇨🇳',n:'ZH'},{c:'ja',f:'🇯🇵',n:'JA'},{c:'ko',f:'🇰🇷',n:'KO'},{c:'fr',f:'🇫🇷',n:'FR'}].map(l=>(
              <button key={l.c}
                onClick={()=>setVoiceLang(l.c)}
                title={LANG_SPEECH[l.c]}
                style={{
                  padding:'1px 7px',borderRadius:20,fontSize:11,cursor:'pointer',
                  fontWeight:700,border:'1.5px solid',transition:'all .12s',
                  background: voiceLang===l.c ? '#e53935':'#fff',
                  borderColor: voiceLang===l.c ? '#e53935':'#e0e0e0',
                  color: voiceLang===l.c ? '#fff':'#757575',
                }}>
                {l.f} {l.n}
              </button>
            ))}
          </div>
        )}
      </>)}

      {/* Translate tab */}
      {activeTab==='translate' && (
        <TranslatePanel
          key={`${trInit.text}-${trInit.src}-${trInit.tgt}`}
          initText={trInit.text}
          initSrc={trInit.src}
          initTgt={trInit.tgt}
          onTranslateToChat={translateToChat}/>
      )}

      {/* Hardware tab */}
      {activeTab==='hardware' && (
        <HardwarePanel onSendToChat={msg => { push({ type:'bot', text: msg }); setActiveTab('chat'); }}/>
      )}

      {/* Browse tab */}
      {activeTab==='browse' && (
        <div className="fbrowser">
          {/* Breadcrumb */}
          <div className="fb-crumb">
            <span style={{cursor:'pointer',color:'#1565c0',fontWeight:700}}
              onClick={()=>browseDir2('')}>🏠 Gốc</span>
            {browseDir && browseDir.split('\\').filter(Boolean).map((seg,i,arr)=>(
              <span key={i}>
                <span style={{color:'#9aa0a6',margin:'0 3px'}}>/</span>
                <span style={{cursor:'pointer',color:'#1565c0'}}
                  onClick={()=>browseDir2(arr.slice(0,i+1).join('\\'))}>{seg}</span>
              </span>
            ))}
          </div>

          {!browseTree ? (
            <div style={{textAlign:'center',color:'#9aa0a6',padding:20}}>Đang tải...</div>
          ) : browseTree.children?.length === 0 ? (
            <div style={{textAlign:'center',color:'#9aa0a6',padding:20}}>📂 Thư mục trống</div>
          ) : browseTree.children?.map((item,i)=>(
            <div key={i}
              className={`fb-item ${item.isDir?'fb-dir':'fb-file'}`}
              onClick={()=>{
                if (item.isDir) browseDir2(item.path);
                else onFileSelect({
                  name: item.name,
                  nameNoExt: item.name.replace(/\.[^.]+$/,''),
                  path: item.path,
                  dir: browseDir ? browseDir.replace(/^.*[\\\/]/,'') : '',
                  ext: item.ext,
                  icon: item.icon,
                  size: item.size||'',
                  modified:'',
                  score:100,
                });
              }}>
              <span className="fb-ic">{item.icon}</span>
              <span className="fb-name">{item.name}</span>
              {item.size && <span className="fb-sz">{item.size}</span>}
              {item.isDir && <span style={{fontSize:10,color:'#9aa0a6'}}>›</span>}
            </div>
          ))}
        </div>
      )}
    </div>

    <Toast text={toast}/>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
