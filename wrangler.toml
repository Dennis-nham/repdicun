# ── Cloudflare Pages config ──────────────────────────────────────────────────
name = "file-chat-app"
compatibility_date = "2024-01-15"
pages_build_output_dir = "public"

# ── Cloudflare Worker (Functions) ─────────────────────────────────────────────
# API endpoints are in /functions folder (Cloudflare Pages Functions)
# They proxy to the local Node.js server or run standalone logic

[vars]
# Set this in Cloudflare dashboard → Pages → Settings → Environment Variables
# LOCAL_API_URL = "https://your-tunnel.trycloudflare.com"  # your local server via CF Tunnel
ENVIRONMENT = "production"
